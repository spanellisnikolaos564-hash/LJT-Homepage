name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      build_only:
        description: "Validate the site without deploying to Pages"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Pages
        if: ${{ !inputs.build_only }}
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate remembered information
        if: ${{ success() }}
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.article_titles = []
                  self.text = []
                  self.in_title = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag == 'h2' and attrs.get('class') == 'archive__item-title':
                      self.in_title = True
              def handle_endtag(self, tag):
                  if tag == 'h2':
                      self.in_title = False
              def handle_data(self, data):
                  self.text.append(data)
                  if self.in_title:
                      self.article_titles.append(data.strip())

          for name in ('index.html', 'publications/index.html', 'about/index.html'):
              page = Page()
              page.feed(Path('_site', name).read_text())
              assert len(page.article_titles) == 6, (name, page.article_titles)
              assert 'mailto:jliugi@connect.ust.hk' in page.links, name
              assert 'https://github.com/Vicent0205' in page.links, name
              assert any('user=tbK9jl4AAAAJ' in link for link in page.links), name
              assert any(link.endswith('/junteng88716710') for link in page.links), name
              for text in ('natural language processing', 'machine learning', 'MINIMAX', 'Tencent WXG', 'Shanghai AI Lab', 'Zhiyuan Honor Scholarship', 'Professor Junxian He', 'Zifei Shan', 'Prof. Yu Cheng', 'B.Eng.', 'Ph.D. in Computer Science', 'June 2024', 'February 2025', 'LLM reasoning and reinforcement learning', 'vision-language models', 'LLM truthfulness and interpretability'):
                  assert text.lower() in page.text.join(' ').lower(), text
              combined = ' '.join(page.text)
              for text in ('Your Name', 'Red Brick University', 'Paper Title Number', 'GitHub University'):
                  assert text not in combined, text
              print(f'Validated {name}: six publications, remembered biography, and contact links.')
          PY
      - name: Upload artifact
        if: ${{ !inputs.build_only && success() }}
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && !inputs.build_only && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
